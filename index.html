<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chess Battle Simulator</title>
  <meta name="description" content="Spend a fixed budget on chess pieces, deploy them, then checkmate the enemy AI." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" />
  <link rel="icon" href="assets/pieces/wN.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="brand" type="button" data-testid="nav-menu" aria-label="Back to menu">
        <img src="assets/pieces/wN.svg" alt="" />
        <span>Chess Battle Simulator</span>
      </button>
      <div class="topbar-actions">
        <button class="icon-btn" type="button" data-testid="sound-toggle" aria-label="Toggle sound"></button>
        <button class="icon-btn" type="button" data-testid="fullscreen-toggle" aria-label="Toggle fullscreen">⛶</button>
      </div>
    </header>
    <main id="screen" tabindex="-1"></main>
    <div id="toast" role="status" aria-live="polite"></div>
  </div>
  <noscript>This game needs JavaScript.</noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
