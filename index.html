<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chess Battle Simulator</title>
  <meta name="description" content="Spend a fixed budget on chess pieces, deploy them, then checkmate the enemy AI." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,500;0,600;0,700;1,500&display=swap" />
  <link rel="icon" href="assets/pieces/wN.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="brand" type="button" data-testid="nav-menu" aria-label="Back to the menu">Chess Battle Simulator</button>
      <nav class="topbar-actions" aria-label="Game">
        <button class="nav-btn" type="button" data-testid="nav-settings">Settings</button>
        <button class="nav-btn" type="button" data-testid="sound-toggle">Sound on</button>
        <button class="nav-btn" type="button" data-testid="fullscreen-toggle">Full screen</button>
      </nav>
    </header>
    <main id="screen" tabindex="-1"></main>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="consent-overlay" class="modal-backdrop" hidden></div>
  </div>
  <noscript>This game needs JavaScript.</noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
